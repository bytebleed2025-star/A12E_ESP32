; ============================================================================
;  A12E Scale Monitor - minimal firmware (standalone project)
;
;  This is a SEPARATE PlatformIO project from the main A12E_ESP32 firmware.
;  It only does one thing: read the scale/display over RS232 and show the
;  weight on a web page. No relays, no thresholds, no LittleFS.
;
;  Open THIS folder (esp32_min_web) in VS Code + PlatformIO.
;  The main project in the parent folder is not modified.
; ============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; No external libraries needed:
; - WebServer comes from the Arduino ESP32 core
; - RS232 uses HardwareSerial from the Arduino ESP32 core
; - The web page is embedded in the firmware (no LittleFS / uploadfs step)
