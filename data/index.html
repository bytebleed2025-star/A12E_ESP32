<!DOCTYPE html>
<html>
<head>
  <title>ESP32 Scale</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 30px;
      max-width: 500px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
      font-size: 28px;
    }
    .weight-display {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      margin-bottom: 30px;
    }
    .weight-label {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 10px;
    }
    .weight-value {
      font-size: 48px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }
    .relay-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }
    .relay-card {
      border: 2px solid #eee;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }
    .relay-card:hover {
      border-color: #667eea;
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.1);
    }
    .relay-title {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 8px;
    }
    .relay-threshold {
      font-size: 12px;
      color: #999;
      margin-bottom: 15px;
    }
    .status-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }
    .status-indicator.on {
      background-color: #4CAF50;
      box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
    }
    .status-indicator.off {
      background-color: #f44336;
    }
    .status-text {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 15px;
    }
    .button-group {
      display: flex;
      gap: 8px;
    }
    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
      font-size: 13px;
    }
    .btn-on {
      background-color: #4CAF50;
      color: white;
    }
    .btn-on:hover {
      background-color: #45a049;
      transform: translateY(-2px);
    }
    .btn-off {
      background-color: #f44336;
      color: white;
    }
    .btn-off:hover {
      background-color: #da190b;
      transform: translateY(-2px);
    }
    .footer {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
      color: #999;
    }
    .auto-mode {
      background-color: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚖️ Scale Control</h1>
    
    <div class="weight-display">
      <div class="weight-label">Current Weight</div>
      <div class="weight-value"><span id="weight">0.0</span> kg</div>
    </div>

    <div class="auto-mode">
      🔄 <strong>Auto Mode:</strong> Relays activate automatically based on weight thresholds
    </div>

    <div class="relay-grid">
      <div class="relay-card">
        <div class="relay-title">Relay 1</div>
        <div class="relay-threshold">(>100 kg)</div>
        <div class="status-text">
          <span class="status-indicator" id="relay1Indicator"></span>
          <span id="relay1Text">OFF</span>
        </div>
        <div class="button-group">
          <button class="btn-on" onclick="setRelay(1, 1)">ON</button>
          <button class="btn-off" onclick="setRelay(1, 0)">OFF</button>
        </div>
      </div>

      <div class="relay-card">
        <div class="relay-title">Relay 2</div>
        <div class="relay-threshold">(>200 kg)</div>
        <div class="status-text">
          <span class="status-indicator" id="relay2Indicator"></span>
          <span id="relay2Text">OFF</span>
        </div>
        <div class="button-group">
          <button class="btn-on" onclick="setRelay(2, 1)">ON</button>
          <button class="btn-off" onclick="setRelay(2, 0)">OFF</button>
        </div>
      </div>
    </div>

    <div class="footer">
      ESP32 Scale Control • Real-time Updates
    </div>
  </div>

  <script>
    function updateStatus() {
      fetch('/api/status')
        .then(r => r.json())
        .then(data => {
          document.getElementById('weight').textContent = data.weight.toFixed(1);
          document.getElementById('relay1Indicator').className = 'status-indicator ' + (data.relay1 ? 'on' : 'off');
          document.getElementById('relay1Text').textContent = data.relay1 ? 'ON' : 'OFF';
          document.getElementById('relay2Indicator').className = 'status-indicator ' + (data.relay2 ? 'on' : 'off');
          document.getElementById('relay2Text').textContent = data.relay2 ? 'ON' : 'OFF';
        });
    }

    function setRelay(relay, state) {
      fetch(`/api/relay?relay=${relay}&state=${state}`)
        .then(r => r.json())
        .then(() => updateStatus());
    }

    setInterval(updateStatus, 1000);
    updateStatus();
  </script>
</body>
</html>
